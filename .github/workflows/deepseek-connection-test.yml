name: DeepSeek connection test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deepseek-connection-test
  cancel-in-progress: true

jobs:
  test:
    name: Test DeepSeek with Codex CLI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEEPSEEK_BASE_URL: https://api.deepseek.com
      DEEPSEEK_MODEL: deepseek-chat

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Validate secret
        shell: bash
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "DEEPSEEK_API_KEY is not configured." >&2
            exit 1
          fi

      - name: Test DeepSeek endpoints
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node .github/scripts/test-deepseek-connection.mjs

      - name: Install Codex CLI
        run: npm install --global @openai/codex@0.147.0

      - name: Configure DeepSeek provider
        shell: bash
        run: |
          CODEX_HOME="$RUNNER_TEMP/codex-home"
          echo "CODEX_HOME=$CODEX_HOME" >> "$GITHUB_ENV"
          mkdir -p "$CODEX_HOME"
          cat > "$CODEX_HOME/config.toml" <<'EOF'
          model = "deepseek-chat"
          model_provider = "deepseek"
          approval_policy = "never"
          sandbox_mode = "danger-full-access"

          [shell_environment_policy]
          inherit = "core"
          ignore_default_excludes = false

          [shell_environment_policy.filters]
          "DEEPSEEK_API_KEY" = "exclude"

          [model_providers.deepseek]
          name = "DeepSeek"
          base_url = "https://api.deepseek.com"
          env_key = "DEEPSEEK_API_KEY"
          wire_api = "responses"
          EOF

      - name: Test Codex read-only tool call
        shell: bash
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -o pipefail
          probe="$(cat /proc/sys/kernel/random/uuid)"
          printf 'PROJECT_PROBE=%s\n' "$probe" > .codex-tool-probe.txt

          printf '%s\n' \
            'Use the shell tool to run `cat .codex-tool-probe.txt`. Do not guess, do not modify files, and reply with exactly the single line printed by that command.' \
            | codex exec --ephemeral --sandbox danger-full-access --json \
                --output-last-message "$RUNNER_TEMP/codex-last-message.txt" - \
            | tee "$RUNNER_TEMP/codex-events.jsonl"

          CODEX_EXPECTED_MESSAGE="PROJECT_PROBE=$probe" \
            node .github/scripts/test-deepseek-connection.mjs codex \
            "$RUNNER_TEMP/codex-events.jsonl" \
            "$RUNNER_TEMP/codex-last-message.txt"

          changes="$(git status --porcelain --untracked-files=all)"
          if [ "$changes" != "?? .codex-tool-probe.txt" ]; then
            echo "Codex changed repository files unexpectedly:" >&2
            printf '%s\n' "$changes" >&2
            exit 1
          fi
          rm .codex-tool-probe.txt
