name: DeepSeek connection test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deepseek-connection-test
  cancel-in-progress: true

jobs:
  test:
    name: Test DeepSeek API compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_BASE_URL: https://api.deepseek.com
      DEEPSEEK_MODEL: deepseek-chat

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Validate secret
        shell: bash
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "DEEPSEEK_API_KEY is not configured." >&2
            exit 1
          fi

      - name: Test DeepSeek endpoints
        run: node .github/scripts/test-deepseek-connection.mjs

