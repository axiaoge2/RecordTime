name: DeepSeek bug hunt every 8 hours

on:
  schedule:
    # Every 8 hours: 03:30, 11:30, and 19:30 Asia/Shanghai (UTC+8)
    - cron: "30 3,11,19 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: daily-deepseek-bug-hunt
  cancel-in-progress: false

jobs:
  analyze:
    name: Discover bug candidates with Flash
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DEEPSEEK_MODEL: deepseek-v4-flash

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Codex CLI
        run: npm install --global @openai/codex@0.147.0

      - name: Configure DeepSeek provider
        shell: bash
        run: bash .github/scripts/configure-deepseek-codex.sh

      - name: Find bug candidates
        shell: bash
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -o pipefail
          codex exec --ephemeral --sandbox danger-full-access --json \
            --output-last-message "$RUNNER_TEMP/candidates.json" - \
            < .github/codex/prompts/find-bugs.md \
            | tee "$RUNNER_TEMP/codex-events.jsonl"

          node .github/scripts/codex-automation.mjs validate-events \
            "$RUNNER_TEMP/codex-events.jsonl"
          node .github/scripts/codex-automation.mjs validate-findings \
            "$RUNNER_TEMP/candidates.json"

          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "Read-only analysis changed repository files." >&2
            git status --short >&2
            exit 1
          fi

      - name: Upload candidate findings
        uses: actions/upload-artifact@v4
        with:
          name: daily-deepseek-candidates
          path: ${{ runner.temp }}/candidates.json
          if-no-files-found: error
          retention-days: 1

  verify:
    name: Independently verify candidates with Pro
    needs: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DEEPSEEK_MODEL: deepseek-v4-pro

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Download candidate findings
        uses: actions/download-artifact@v4
        with:
          name: daily-deepseek-candidates
          path: ${{ runner.temp }}/candidates

      - name: Install Codex CLI
        run: npm install --global @openai/codex@0.147.0

      - name: Configure DeepSeek provider
        shell: bash
        run: bash .github/scripts/configure-deepseek-codex.sh

      - name: Verify candidates
        shell: bash
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -o pipefail
          {
            cat .github/codex/prompts/verify-bugs.md
            printf '\n\n# Untrusted candidate JSON\n'
            cat "$RUNNER_TEMP/candidates/candidates.json"
          } | codex exec --ephemeral --sandbox danger-full-access --json \
              --output-last-message "$RUNNER_TEMP/findings.json" - \
              | tee "$RUNNER_TEMP/codex-events.jsonl"

          node .github/scripts/codex-automation.mjs validate-events \
            "$RUNNER_TEMP/codex-events.jsonl"
          node .github/scripts/codex-automation.mjs validate-findings \
            "$RUNNER_TEMP/findings.json"

          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "Read-only verification changed repository files." >&2
            git status --short >&2
            exit 1
          fi

      - name: Upload verified findings
        uses: actions/upload-artifact@v4
        with:
          name: daily-deepseek-findings
          path: ${{ runner.temp }}/findings.json
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish Issues and build fix queue
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    outputs:
      has_queue: ${{ steps.publish.outputs.has_queue }}
      queue: ${{ steps.publish.outputs.queue }}

    steps:
      - name: Check out trusted automation code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Download verified findings
        uses: actions/download-artifact@v4
        with:
          name: daily-deepseek-findings
          path: ${{ runner.temp }}/findings

      - name: Create verified Issues and collect queue
        id: publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node .github/scripts/codex-automation.mjs publish-findings
          "${{ runner.temp }}/findings/findings.json"

  fix_queue:
    name: Fix Issue ${{ matrix.issue.issue_number }}
    needs: publish
    if: needs.publish.outputs.has_queue == 'true'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        issue: ${{ fromJSON(needs.publish.outputs.queue) }}
    uses: ./.github/workflows/bot-fix.yml
    with:
      issue_number: ${{ matrix.issue.issue_number }}
    secrets:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
